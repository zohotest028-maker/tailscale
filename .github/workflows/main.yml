name: Windows RDP Runner

on:
  workflow_dispatch:
    inputs:
      user_prefix:
        description: 'Username prefix for runner host identification'
        required: true
        default: 'user'
        type: string

jobs:
  provision-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          Start-Sleep -Seconds 3
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="${{ inputs.user_prefix }}-${{ github.run_id }}" --accept-routes

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Credentials
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $UserAccount = Get-LocalUser -Name "runneradmin"
          $UserAccount | Set-LocalUser -Password $Password

      - name: Install Software and Playwright
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          # 1. Silently install Google Chrome
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "$env:TEMP\chrome_installer.exe"
          Start-Process "$env:TEMP\chrome_installer.exe" -ArgumentList "/silent", "/install" -Wait

          # 2. Silently install WinRAR (Latest x64 stable version)
          Invoke-WebRequest -Uri "https://www.rarlab.com/rar/winrar-x64-701.exe" -OutFile "$env:TEMP\winrar_installer.exe"
          Start-Process "$env:TEMP\winrar_installer.exe" -ArgumentList "/s" -Wait

          # 3. Download and silently install Python 3.14.5 with system PATH integration
          $PythonVersion = "3.14.5"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$PythonVersion/python-$PythonVersion-amd64.exe" -OutFile "$env:TEMP\python_installer.exe"
          $PythonArgs = @(
              '/passive',
              'InstallAllUsers=1',
              'PrependPath=1',
              'Include_test=0'
          )
          Start-Process -FilePath "$env:TEMP\python_installer.exe" -ArgumentList $PythonArgs -Wait

          # Refresh environment PATH so pip and python commands work immediately in the same session
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")

          # 4. Install Playwright and its Chromium binaries
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium

      - name: Keep Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600
